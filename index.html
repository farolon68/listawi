<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Streamings Individuales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .video-card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        /* Contenedor del reproductor / marcador de posición */
        .video-container {
            width: 100%;
            height: 300px;
            background-color: #000;
            position: relative;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        /* Botón para activar el stream */
        .play-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            z-index: 2;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background-color: #b80710;
        }
        /* Estilo para cuando el iframe ya está cargado */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <h1>Mi Panel de Streamings</h1>
    <p>Haz clic en el botón de cualquier canal para empezar a reproducirlo.</p>

    <div class="grid-container">

        <!-- CANAL 1 -->
        <div class="video-card">
            <h3>MOVISTAR PLUS</h3>
            <!-- En data-embed pones SOLAMENTE la URL que va dentro de tu iframe (el src) -->
            <div class="video-container" id="stream1" data-embed="https://dlive.sx/stream/stream-437.php" style="background-image: url('https://picsum.photos');">
                <button class="play-btn" onclick="cargarVideo('stream1')">Ver Streaming</button>

    <script>
        function cargarVideo(idContenedor) {
            const contenedor = document.getElementById(idContenedor);
            const urlEmbed = contenedor.getAttribute('data-embed');
            
            // Creamos el iframe en tiempo real al hacer clic
            const iframe = document.createElement('iframe');
            iframe.setAttribute('src', urlEmbed);
            iframe.setAttribute('allowfullscreen', 'true');
            // Intentamos forzar el autoplay para que no tengas que hacer un segundo clic dentro del reproductor
            if (urlEmbed.includes('?')) {
                iframe.setAttribute('src', urlEmbed + '&autoplay=1');
            } else {
                iframe.setAttribute('src', urlEmbed + '?autoplay=1');
            }

            // Limpiamos el botón y metemos el video
            contenedor.innerHTML = '';
            contenedor.appendChild(iframe);
        }
    </script>
